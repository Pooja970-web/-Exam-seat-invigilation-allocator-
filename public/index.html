<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Seat & Invigilation Allocator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--panel:#fff;--ink:#16213a;--mute:#64708a;--line:#dde2ea;--ac:#1f4fd8;--acink:#fff;--ok:#12805c;--bad:#c2331f;--seat-l:86%;--seat-s:70%;--seat-ink:#16213a;--empty:#eef0f4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--panel:#171e2e;--ink:#e8ecf5;--mute:#8d99b3;--line:#283249;--ac:#7b9bff;--acink:#0f1420;--ok:#4cc79a;--bad:#ff8a78;--seat-l:30%;--seat-s:45%;--seat-ink:#eef2fb;--empty:#1d2538}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,sans-serif;line-height:1.45}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:20px 28px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:14px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:11px 4px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:inherit;font-weight:600;cursor:pointer;font-size:.9rem}
.tab small{display:block;font-weight:400;font-size:.75rem}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ac)}
.body{padding:14px}
.hint{margin:0 0 8px;color:var(--mute);font-size:.85rem}
textarea{width:100%;height:250px;resize:vertical;padding:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12.5px/1.5 ui-monospace,Consolas,monospace}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.set{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:14px;border-top:1px solid var(--line)}
.set label{font-size:.85rem;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:9px 15px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:.9rem;display:inline-block}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.btn.pri[disabled]{opacity:.6;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px 14px}
.stat b{display:block;font-size:1.5rem;font-weight:800}
.stat span{color:var(--mute);font-size:.82rem}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:.85rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:hsl(var(--h) var(--seat-s) var(--seat-l))}
.room{padding:16px;margin-bottom:16px}
.room h3{margin:0;font-size:1.05rem}
.room .meta{color:var(--mute);font-size:.88rem;margin:2px 0 12px}
.board{text-align:center;padding:5px;margin:0 auto 10px;background:var(--ink);color:var(--bg);border-radius:4px;font-size:.75rem;width:60%;min-width:140px}
.grid{display:grid;gap:6px;overflow-x:auto}
.seat{border-radius:6px;padding:7px 4px;text-align:center;min-width:56px;background:hsl(var(--h) var(--seat-s) var(--seat-l));color:var(--seat-ink);font-size:.72rem;line-height:1.25}
.seat b{display:block;font-size:.82rem}
.seat.empty{background:var(--empty);min-height:38px}
.loads{padding:16px}
.loads h3{margin:0 0 10px;font-size:1.05rem}
.ld{display:grid;grid-template-columns:110px 1fr 24px;gap:8px;align-items:center;font-size:.85rem;margin:4px 0}
.ld div{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}.ld i{display:block;height:100%;background:var(--ac)}
.msg{padding:14px 16px;border-radius:8px;border:1px solid var(--bad);color:var(--bad);background:var(--panel)}
.empty-state{padding:48px 20px;text-align:center;color:var(--mute)}
.empty-state b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
</style></head>
<body>
<header>
  <div><h1>Exam Seat & Invigilation Allocator</h1><p>Seating plans and duty rosters, generated from your rooms, students and teachers.</p></div>
  <div class="row" style="margin:0"><button class="btn" id="sample">Load sample data</button><button class="btn pri" id="gen">Generate plan</button></div>
</header>
<div class="wrap">
  <section class="panel" aria-label="Input data">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="body" id="inputs"></div>
    <div class="set">
      <label>Invigilators per room<input type="number" id="pr" value="2" min="1"></label>
      <label>Max duties per teacher<input type="number" id="md" value="6" min="1"></label>
    </div>
  </section>
  <main id="out"><div class="panel empty-state"><b>No plan yet</b>Load the sample data or add your own, then select Generate plan.</div></main>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS={
 rooms:['Rooms','name, rows, columns','R101,5,6'],
 students:['Students','id, name, branch, subjects (separate several with ;)','S1,Asha Rao,CS,MATH'],
 teachers:['Teachers','name, subject','Prof. Mehta,MATH'],
 exams:['Exams','subject, date, time','MATH,2026-12-01,10:00']};
const HUES=[215,150,30,330,270,5,185,95,50,300];
let active='rooms', last=null, slotIdx=0;

$('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="tab" role="tab" data-k="${k}"><span>${v[0]}</span><small id="n-${k}">0 rows</small></button>`).join('');
$('#inputs').innerHTML=Object.entries(TABS).map(([k,v])=>`<div data-p="${k}"><p class="hint">One per line: <b>${v[1]}</b>. No header row.</p>
 <textarea id="t-${k}" spellcheck="false" placeholder="${esc(v[2])}"></textarea>
 <div class="row"><label class="btn">Upload CSV<input type="file" accept=".csv,.txt" data-f="${k}" hidden></label><button class="btn" data-c="${k}">Clear</button></div></div>`).join('');

function showTab(k){active=k;
 document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
 document.querySelectorAll('[data-p]').forEach(p=>p.hidden=p.dataset.p!==k);}
function counts(){for(const k in TABS)$('#n-'+k).textContent=lines(k).length+' rows';}
const lines=k=>$('#t-'+k).value.split('\n').map(l=>l.trim()).filter(Boolean);
const rows=k=>lines(k).map(l=>l.split(',').map(x=>x.trim()));

document.addEventListener('click',e=>{
 const t=e.target.closest('.tab'); if(t)showTab(t.dataset.k);
 const c=e.target.closest('[data-c]'); if(c){$('#t-'+c.dataset.c).value='';counts();}});
document.addEventListener('input',counts);
document.addEventListener('change',e=>{const f=e.target.dataset.f; if(!f||!e.target.files[0])return;
 e.target.files[0].text().then(t=>{$('#t-'+f).value=t.replace(/\r/g,'').trim();counts();e.target.value='';});});

function sample(){
 const S=['MATH','PHY','CHEM'],br=['CS','EC','ME'];
 $('#t-rooms').value='R101,5,6\nR102,5,6\nR103,4,5';
 $('#t-students').value=Array.from({length:75},(_,i)=>`S${i+1},Student ${i+1},${br[i%3]},${S[(i*7)%3]}`).join('\n');
 $('#t-teachers').value=Array.from({length:15},(_,i)=>`Prof ${i+1},${S[i%3]}`).join('\n');
 $('#t-exams').value='MATH,2026-12-01,10:00\nPHY,2026-12-01,10:00\nCHEM,2026-12-01,10:00';
 counts();}
$('#sample').onclick=sample; $('#gen').onclick=generate;

async function generate(){
 const btn=$('#gen'); btn.disabled=true; btn.textContent='Generating...';
 try{
  const body={rooms:rows('rooms').map(r=>({name:r[0],rows:+r[1],cols:+r[2]})),
   students:rows('students').map(r=>({id:r[0],name:r[1],branch:r[2],subjects:(r[3]||'').split(';').map(x=>x.trim()).filter(Boolean)})),
   teachers:rows('teachers').map(r=>({name:r[0],subject:r[1]})),
   exams:rows('exams').map(r=>({subject:r[0],date:r[1],time:r[2]})),
   perRoom:+$('#pr').value||2,maxDuties:+$('#md').value||5};
  if(body.rooms.some(r=>!(r.rows>0&&r.cols>0)))throw new Error('Each room needs numeric rows and columns, for example R101,5,6.');
  if(!body.students.length||!body.exams.length||!body.teachers.length)throw new Error('Add at least one student, teacher and exam before generating.');
  const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await res.json(); if(d.error)throw new Error(d.error);
  last=d; last.maxDuties=body.maxDuties; slotIdx=0; render();
 }catch(err){$('#out').innerHTML=`<div class="msg"><b>Could not generate the plan.</b><br>${esc(err.message)}</div>`;}
 btn.disabled=false; btn.textContent='Generate plan';}

function render(){
 const d=last,s=d.summary,slot=d.slots[slotIdx];
 const subs=[...new Set(d.slots.flatMap(x=>x.subjects))], hue=x=>HUES[subs.indexOf(x)%HUES.length];
 const rooms=d.slots.reduce((n,x)=>n+x.plan.length,0);
 let h=`<div class="stats">
  <div class="panel stat"><b>${s.slots}</b><span>Exam slots</span></div>
  <div class="panel stat"><b>${rooms}</b><span>Rooms used</span></div>
  <div class="panel stat ${s.seatingViolations?'bad':'ok'}"><b>${s.seatingViolations}</b><span>Seating clashes</span></div>
  <div class="panel stat"><b>${s.totalDuties}</b><span>Invigilation duties</span></div>
  <div class="panel stat"><b>${s.minLoad}-${s.maxLoad}</b><span>Duties per teacher</span></div></div>
  <div class="bar"><div class="slots">${d.slots.map((x,i)=>`<button class="chip" aria-pressed="${i===slotIdx}" data-s="${i}">${esc(x.key)}</button>`).join('')}</div>
  <div class="row" style="margin:0"><a class="btn pri" href="/api/pdf/seating/${d.id}">Download seating PDF</a><a class="btn" href="/api/pdf/roster/${d.id}">Download duty roster PDF</a></div></div>
  <div class="legend">${slot.subjects.map(x=>`<span><i style="--h:${hue(x)}"></i>${esc(x)}</span>`).join('')}</div>`;
 h+=slot.plan.map(p=>{
  const cnt=p.grid.flat().filter(Boolean).length;
  return `<section class="panel room"><h3>${esc(p.room.name)}</h3>
  <p class="meta">${cnt} students in ${p.room.rows} x ${p.room.cols} seats. Invigilators: ${p.invigilators.map(esc).join(', ')}</p>
  <div class="board">Front of room</div>
  <div class="grid" style="grid-template-columns:repeat(${p.room.cols},minmax(56px,1fr))">`+
  p.grid.flat().map(c=>c?`<div class="seat" style="--h:${hue(c.subject)}" title="${esc(c.name)} (${esc(c.branch)}) - ${esc(c.subject)}"><b>${esc(c.id)}</b>${esc(c.subject)}</div>`:'<div class="seat empty"></div>').join('')+`</div></section>`}).join('');
 const mx=Math.max(d.maxDuties,1);
 h+=`<section class="panel loads"><h3>Duty load per teacher</h3>`+Object.entries(d.load).map(([n,c])=>`<div class="ld"><span>${esc(n)}</span><div><i style="width:${Math.min(100,c/mx*100)}%"></i></div><b>${c}</b></div>`).join('')+`</section>`;
 $('#out').innerHTML=h;
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{slotIdx=+b.dataset.s;render();});}

showTab('rooms'); sample();
</script></body></html>
